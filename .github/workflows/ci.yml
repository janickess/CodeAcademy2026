name: ci
on:
  pull_request:
    paths:
      - '1-DevOps/idempotweet/**'
      - '.github/workflows/ci.yml'
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'self-hosted' }}
    defaults:
      run:
        working-directory: 1-DevOps/idempotweet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable corepack
        working-directory: .
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test

      - name: Run test coverage
        run: yarn test:coverage
